name: Offline tests

on:
  push:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest genlayer-test

      - name: Pre-cache GenVM SDK tarball
        run: |
          mkdir -p ~/.cache/gltest-direct
          curl -fLsS \
            https://github.com/genlayerlabs/genvm/releases/download/v0.3.0-rc7/genvm-runners-all.tar.xz \
            -o ~/.cache/gltest-direct/genvm-universal-v0.3.0-rc7.tar.xz

      - name: Run offline tests
        run: pytest tests/ -v
